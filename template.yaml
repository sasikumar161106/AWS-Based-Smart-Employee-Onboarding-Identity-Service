AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart Employee Onboarding & Identity Service - Backend API & Employee Data

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref EmployeeOnboardingTable
        USER_POOL_ID: !Ref EmployeeUserPool
        EMPLOYEES_GROUP: Employees

Resources:
  # Amazon Cognito User Pool (Identity Spine - Virajith)
  EmployeeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: SmartEmployeeUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: employee_id
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: department
          AttributeDataType: String
          Required: false
          Mutable: true

  EmployeeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: SmartEmployeeWebClient
      UserPoolId: !Ref EmployeeUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  EmployeesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employees
      Description: Group for onboarding employees and new hires
      UserPoolId: !Ref EmployeeUserPool

  HRAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: HRAdmins
      Description: Group for HR Administrators with dashboard access
      UserPoolId: !Ref EmployeeUserPool

  # DynamoDB Table
  EmployeeOnboardingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EmployeeOnboardingTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employee_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: record_status
          AttributeType: S
      KeySchema:
        - AttributeName: employee_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: RecordStatusIndex
          KeySchema:
            - AttributeName: record_status
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # API Gateway
  OnboardingAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Create Employee Lambda
  CreateEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/createEmployee.handler
      Description: Creates a new employee record and triggers Cognito provisioning
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmployeeOnboardingTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
              Resource: !GetAtt EmployeeUserPool.Arn
      Events:
        SubmitApi:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingAPI
            Path: /submit
            Method: post

  # Get Progress Lambda
  GetProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getProgress.handler
      Description: Retrieves onboarding progress for an employee
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmployeeOnboardingTable
      Events:
        ProgressApi:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingAPI
            Path: /progress/{employee_id}
            Method: get

  # Get Admin Pipeline Lambda
  GetAdminPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getAdminPipeline.handler
      Description: Retrieves pipeline of all onboarding employees for HR dashboard
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmployeeOnboardingTable
      Events:
        AdminPipelineApi:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingAPI
            Path: /admin/pipeline
            Method: get

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${OnboardingAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref EmployeeUserPool
  UserPoolClientId:
    Description: "Cognito User Pool App Client ID"
    Value: !Ref EmployeeUserPoolClient

